<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ali Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f9fc;color:#202124}header{background:#fff;border-bottom:1px solid #ddd;padding:14px 5%;display:flex;gap:20px;align-items:center;position:sticky;top:0;z-index:5}.logo{font-size:26px;font-weight:bold;color:#1a73e8}.logo span{color:#34a853}.search{flex:1;max-width:650px}.search input{width:100%;padding:13px 18px;border:0;background:#f1f3f4;border-radius:28px;font-size:16px}main{max-width:1150px;margin:auto;padding:25px 16px}.tabs{display:flex;gap:8px;overflow:auto}.tabs button,.btn{border:0;border-radius:22px;padding:10px 16px;background:#e8f0fe;color:#1967d2;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px;margin-top:18px}.card{background:#fff;border:1px solid #e2e7ef;border-radius:18px;padding:15px;display:flex;gap:14px}.icon{width:68px;height:68px;border-radius:17px;background:linear-gradient(135deg,#1a73e8,#34a853);color:#fff;display:grid;place-items:center;font-weight:bold;font-size:24px;overflow:hidden}.icon img{width:100%;height:100%;object-fit:cover}.muted{font-size:13px;color:#6b7280;margin:5px 0}.stars{color:#f5a400}.admin{float:right}.modal{display:none;position:fixed;inset:0;background:#fff;z-index:20;overflow:auto;padding:22px}.box{max-width:650px;margin:auto;background:#fff;padding:10px}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd3dd;border-radius:9px}label{font-weight:bold;font-size:14px}.danger{background:#d93025;color:#fff}.hero{padding:25px;border-radius:22px;background:linear-gradient(120deg,#e8f0fe,#eaf7ee);margin:20px 0}.screens{display:flex;gap:10px;overflow:auto}.screens img{width:190px;height:330px;object-fit:cover;border-radius:14px;background:#eee}@media(max-width:600px){header{padding:12px}.grid{grid-template-columns:1fr}}
</style><body>
<header><div class="logo">Ali <span>Store</span></div><div class="search"><input id="q" placeholder="Search apps & games"></div><button class="btn" type="button"onclick="document.getElementByld('admin').style.display='block'''>Admin</button>ixhM
<main><div class="tabs"><button onclick="load('')">For you</button><button onclick="load('Apps')">Apps</button><button onclick="load('Games')">Games</button><button onclick="load('Tools')">Tools</button></div>
<div class="hero"><h1>Welcome to Ali Store</h1><p>Apps aur games khojiye, details dekhiye aur APK download kijiye.</p></div><h2>Apps</h2><div id="grid" class="grid"></div></main>
<div id="detail" class="modal"><div class="box"><button class="btn" onclick="closeM('detail')">← Back</button><div id="detailBody"></div></div></div>
<div id="admin" class="modal"><div class="box"><button class="btn" onclick="closeM('admin')">← Back</button><h2>Admin Panel</h2><div id="login"><label>Email</label><input id="email" value="admin@alystore.app"><label>Password</label><input id="pass" type="password" value="AliStore@123"><button class="btn" onclick="login()">Login</button></div>
<div id="panel" style="display:none"><h3>Upload & Publish App</h3><label>App name</label><input id="name"><label>Description</label><textarea id="desc"></textarea><label>Category</label><select id="cat"><option>Apps</option><option>Games</option><option>Tools</option></select><label>Version</label><input id="ver" value="1.0"><label>APK</label><input id="apk" type="file" accept=".apk"><label>Icon</label><input id="icon" type="file" accept="image/*"><label>Screenshots (up to 8)</label><input id="shots" type="file" accept="image/*" multiple><button class="btn" onclick="publish()">🌐 Publish App</button><p id="msg"></p></div></div></div>
<script>
let apps=[],token=localStorage.getItem("aliToken");
async function load(cat=""){let r=await fetch("/api/apps"),a=await r.json();let q=document.getElementById("q").value.toLowerCase();apps=a.filter(x=>(!cat||x.category==cat)&&x.name.toLowerCase().includes(q));document.getElementById("grid").innerHTML=apps.map(x=>`<div class="card"><div class="icon">${x.icon?`<img src="${x.icon}">`:x.name.slice(0,2)}</div><div><b>${x.name}</b><div class="muted">${x.category} · v${x.version}</div><div class="stars">★ 4.5</div><button class="btn" onclick="details(${x.id})">View & Install</button></div></div>`).join("")||"<p>No apps found.</p>"}
async function details(id){let x=await (await fetch("/api/apps/"+id)).json();document.getElementById("detailBody").innerHTML=`<h1>${x.name}</h1><p>${x.description||""}</p><p>${x.category} · Version ${x.version}</p><a class="btn" href="${x.apk}" download>⬇️ Download / Install APK</a><h2>Reviews</h2>${(x.reviews||[]).map(r=>`<p>★ ${r.rating} — ${r.review}</p>`).join("")}<h3>Rate this app</h3><input id="rating" type="number" min="1" max="5" value="5"><textarea id="review" placeholder="Write review"></textarea><button class="btn" onclick="review(${x.id})">Submit Review</button>`;openM("detail")}
async function review(id){await fetch("/api/apps/"+id+"/reviews",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rating:rating.value,review:review.value})});details(id)}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:pass.value})});let x=await r.json();if(!r.ok)return alert(x.error);token=x.token;localStorage.setItem("aliToken",token);document.getElementById("login").style.display="none";document.getElementById("panel").style.display="block"}
async function publish(){let f=new FormData();f.append("name",name.value);f.append("description",desc.value);f.append("category",cat.value);f.append("version",ver.value);if(!apk.files[0])return alert("APK चुनें");f.append("apk",apk.files[0]);if(icon.files[0])f.append("icon",icon.files[0]);[...shots.files].forEach(s=>f.append("screenshots",s));let r=await fetch("/api/apps",{method:"POST",headers:{Authorization:"Bearer "+token},body:f});let x=await r.json();msg.textContent=x.message||x.error;if(r.ok)load("")}
function openAdmin(){openM("admin");if(token){login.style.display="none";panel.style.display="block"}}
function openM(x){document.getElementById(x).style.display="block"}function closeM(x){document.getElementById(x).style.display="none"}q.oninput=()=>load("");load("");
</script></body></html>
