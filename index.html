<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ali Store</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f7f9fc;color:#202124}
header{background:#fff;border-bottom:1px solid #ddd;padding:14px 5%;display:flex;gap:20px;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-size:26px;font-weight:bold;color:#1a73e8}
.logo span{color:#34a853}
.search{flex:1;max-width:650px}
.search input{width:100%;padding:13px 18px;border:0;background:#f1f3f4;border-radius:28px;font-size:16px}
main{max-width:1150px;margin:auto;padding:25px 16px}
.tabs{display:flex;gap:8px;overflow:auto}
.tabs button,.btn{border:0;border-radius:22px;padding:10px 16px;background:#e8f0fe;color:#1967d2;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px;margin-top:18px}
.card{background:#fff;border:1px solid #e2e7ef;border-radius:18px;padding:15px;display:flex;gap:14px}
.icon{width:68px;height:68px;border-radius:17px;background:linear-gradient(135deg,#1a73e8,#34a853);color:#fff;display:grid;place-items:center;font-weight:bold;font-size:24px;overflow:hidden}
.icon img{width:100%;height:100%;object-fit:cover}
.muted{font-size:13px;color:#6b7280;margin:5px 0}
.stars{color:#f5a400}
.modal{display:none;position:fixed;inset:0;background:#fff;z-index:20;overflow:auto;padding:22px}
.box{max-width:650px;margin:auto;background:#fff;padding:10px}
input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd3dd;border-radius:9px}
label{font-weight:bold;font-size:14px}
.hero{padding:25px;border-radius:22px;background:linear-gradient(120deg,#e8f0fe,#eaf7ee);margin:20px 0}
@media(max-width:600px){
header{padding:12px}
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="logo">Ali <span>Store</span></div>

<div class="search">
<input id="q" placeholder="Search apps & games">
</div>

<button class="btn" type="button"
onclick="document.getElementById('admin').style.display='block'">
Admin
</button>
</header>

<main>

<div class="tabs">
<button onclick="loadApps('')">For you</button>
<button onclick="loadApps('Apps')">Apps</button>
<button onclick="loadApps('Games')">Games</button>
<button onclick="loadApps('Tools')">Tools</button>
</div>

<div class="hero">
<h1>Welcome to Ali Store</h1>
<p>Apps aur games khojiye, details dekhiye aur APK download kijiye.</p>
</div>

<h2>Apps</h2>
<div id="grid" class="grid"></div>

</main>

<!-- DETAIL -->
<div id="detail" class="modal">
<div class="box">
<button class="btn" onclick="closeModal('detail')">← Back</button>
<div id="detailBody"></div>
</div>
</div>

<!-- ADMIN -->
<div id="admin" class="modal">
<div class="box">

<button class="btn" onclick="closeModal('admin')">← Back</button>

<h2>Admin Panel</h2>

<div id="login">
<label>Email</label>
<input id="email" value="admin@alystore.app">

<label>Password</label>
<input id="pass" type="password" placeholder="Enter password">

<button class="btn" onclick="loginAdmin()">Login</button>
</div>

<div id="panel" style="display:none">

<h3>Upload & Publish App</h3>

<label>App name</label>
<input id="name">

<label>Description</label>
<textarea id="desc"></textarea>

<label>Category</label>
<select id="cat">
<option>Apps</option>
<option>Games</option>
<option>Tools</option>
</select>

<label>Version</label>
<input id="ver" value="1.0">

<label>APK</label>
<input id="apk" type="file" accept=".apk">

<label>Icon</label>
<input id="icon" type="file" accept="image/*">

<label>Screenshots</label>
<input id="shots" type="file" accept="image/*" multiple>

<button class="btn" onclick="publishApp()">
🌐 Publish App
</button>

<p id="msg"></p>

</div>
</div>
</div>

<script>

let token=localStorage.getItem("aliToken");

async function loadApps(category=""){

try{

let response=await fetch("/api/apps");
let data=await response.json();

let query=document.getElementById("q").value.toLowerCase();

let apps=data.filter(app =>
(!category || app.category===category) &&
app.name.toLowerCase().includes(query)
);

document.getElementById("grid").innerHTML=
apps.map(app=>`

<div class="card">

<div class="icon">
${app.icon
? `<img src="${app.icon}">`
: app.name.slice(0,2)}
</div>

<div>

<b>${app.name}</b>

<div class="muted">
${app.category} · v${app.version}
</div>

<div class="stars">★ 4.5</div>

<button class="btn"
onclick="showDetails(${app.id})">
View & Install
</button>

</div>

</div>

`).join("") || "<p>No apps found.</p>";

}catch(error){

console.log(error);

}

}

async function showDetails(id){

let response=await fetch("/api/apps/"+id);
let app=await response.json();

document.getElementById("detailBody").innerHTML=`

<h1>${app.name}</h1>

<p>${app.description || ""}</p>

<p>${app.category} · Version ${app.version}</p>

<a class="btn" href="${app.apk}" download>
⬇️ Download / Install APK
</a>

<h2>Reviews</h2>

${(app.reviews || []).map(r=>`
<p>★ ${r.rating} — ${r.review}</p>
`).join("")}

`;

document.getElementById("detail").style.display="block";

}

async function loginAdmin(){

let response=await fetch("/api/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:document.getElementById("email").value,

password:document.getElementById("pass").value

})

});

let result=await response.json();

if(!response.ok){

alert(result.error || "Login failed");

return;

}

token=result.token;

localStorage.setItem("aliToken",token);

document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";

}

async function publishApp(){

let apkFile=document.getElementById("apk").files[0];

if(!apkFile){

alert("APK चुनें");

return;

}

let form=new FormData();

form.append("name",document.getElementById("name").value);

form.append("description",document.getElementById("desc").value);

form.append("category",document.getElementById("cat").value);

form.append("version",document.getElementById("ver").value);

form.append("apk",apkFile);

let iconFile=document.getElementById("icon").files[0];

if(iconFile){
form.append("icon",iconFile);
}

let screenshots=document.getElementById("shots").files;

for(let i=0;i<screenshots.length;i++){

form.append("screenshots",screenshots[i]);

}

let response=await fetch("/api/apps",{

method:"POST",

headers:{
Authorization:"Bearer "+token
},

body:form

});

let result=await response.json();

document.getElementById("msg").textContent=
result.message || result.error;

if(response.ok){

loadApps("");

}

}

function closeModal(id){

document.getElementById(id).style.display="none";

}

document.getElementById("q").addEventListener("input",()=>{
loadApps("");
});

loadApps("");

</script>

</body>
</html>
